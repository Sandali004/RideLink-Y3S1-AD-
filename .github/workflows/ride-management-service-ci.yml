name: Ride Management Service CI

on:
  push:
    branches:
      - main
      - feature/IT24103927/ride-management-service
    paths:
      - "ride-management-service/**"
      - ".github/workflows/ride-management-service-ci.yml"

  pull_request:
    paths:
      - "ride-management-service/**"
      - ".github/workflows/ride-management-service-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Ride Management Service
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ride-management-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            ride-management-service/build.gradle.kts
            ride-management-service/settings.gradle.kts
            ride-management-service/gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run all tests
        run: ./gradlew --no-daemon clean test