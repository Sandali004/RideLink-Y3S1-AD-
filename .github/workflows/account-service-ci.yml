name: Account Service CI

on:
  push:
    branches:
      - main
      - feature/IT24103976/account-service
      - feature/IT24103976/account-security
    paths:
      - "account-service/**"
      - ".github/workflows/account-service-ci.yml"

  pull_request:
    paths:
      - "account-service/**"
      - ".github/workflows/account-service-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Account Service
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: account-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: account-service/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run all tests
        run: ./mvnw --batch-mode clean test