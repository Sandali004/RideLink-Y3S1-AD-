name: Fare Payment Service CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  fare-payment-service:
    name: Build and Test Fare Payment Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fare-payment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B clean test