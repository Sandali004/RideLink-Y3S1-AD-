name: Driver Vehicle Service CI

on:
  push:
    branches:
      - main
      - feature/IT24104020/driver-vehicle-service
    paths:
      - "driver-vehicle-service/**"
      - ".github/workflows/driver-vehicle-service-ci.yml"

  pull_request:
    paths:
      - "driver-vehicle-service/**"
      - ".github/workflows/driver-vehicle-service-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Driver Vehicle Service
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: driver-vehicle-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: driver-vehicle-service/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run all tests
        run: ./mvnw --batch-mode clean test